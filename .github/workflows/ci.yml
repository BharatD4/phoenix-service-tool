name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck Web App
        run: pnpm --filter @phoenix/web typecheck

      - name: Typecheck Desktop App
        run: pnpm --filter @phoenix/desktop typecheck

      - name: Build Web Platform
        run: pnpm --filter @phoenix/web build

      - name: Build Desktop Client
        run: pnpm --filter @phoenix/desktop build
